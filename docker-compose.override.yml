# Development overrides - automatically loaded by docker-compose

services:
  postgres:
    # Dev-only host port, bound to localhost so it isn't reachable on the LAN.
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

  redis:
    # Dev-only host port, bound to localhost. Auth still required (REDIS_PASSWORD).
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  backend:
    environment:
      NODE_ENV: development
    # Dev-only ports bound to localhost. Production traffic goes through Traefik.
    ports:
      - "127.0.0.1:9229:9229"  # Debug port for VS Code
      - "127.0.0.1:${NESTJS_CONTAINER_PORT}:${NESTJS_PORT}"
    # Development-specific volumes for hot reload
    volumes:
      - ./backend/src:/app/src
      - ./backend/test:/app/test
      - ./backend/package.json:/app/package.json
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/nest-cli.json:/app/nest-cli.json
      - ./backend/prisma:/app/prisma
    # File watching for development (Docker Compose v2.22+)
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
          ignore:
            - node_modules/
        - action: sync
          path: ./backend/prisma
          target: /app/prisma
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/yarn.lock
    # Override restart policy for development
    restart: unless-stopped
